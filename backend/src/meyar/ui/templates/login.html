{% extends "base.html" %}
{% block title %}Daxil ol — MEYAR{% endblock %}
{% block content %}
<section class="auth-card">
  <p class="eyebrow">Daxili HR sistemi</p>
  <h1>MEYAR — namizəd axtarışı</h1>
  <p class="lede">İstifadəçi adınız və parolunuzla daxil olun.</p>
  {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/ui/login" autocomplete="off" class="stack-form">
    <label for="username">İstifadəçi adı</label>
    <input id="username" name="username" type="text" required autocomplete="username" spellcheck="false">
    <label for="password">Parol</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <button class="button" type="submit">Daxil ol</button>
  </form>
</section>
{% endblock %}
