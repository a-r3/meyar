{% macro criterion_rows(prefix, rows, kind_options) %}
<div class="table-wrap">
<table>
<thead><tr><th>Növ</th><th>Tələb</th><th>Minimum müddət (il) <span class="muted">(yalnız Təcrübə üçün)</span></th><th>Əhəmiyyət</th></tr></thead>
<tbody>
{% for row in rows %}
{% set is_experience = row.kind == "EXPERIENCE" %}
<tr>
  <td><select class="js-kind-select" name="{{ prefix }}_kind_{{ loop.index0 }}">{% for value, label in kind_options %}<option value="{{ value }}"{% if row.kind == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></td>
  <td><input type="text" name="{{ prefix }}_requirement_{{ loop.index0 }}" value="{{ row.requirement }}" maxlength="200" placeholder="Məs. Python, ACAMS, İngilis dili — 'Təcrübə' üçün qısa təsvir, məs. Minimum backend təcrübəsi"></td>
  <td><input type="number" step="0.5" min="0" max="60" class="js-min-years" name="{{ prefix }}_min_years_{{ loop.index0 }}" value="{{ row.min_years if is_experience else "" }}" placeholder="{{ "Minimum müddət (il)" if is_experience else "Tətbiq olunmur" }}"{% if not is_experience %} disabled aria-disabled="true"{% endif %}></td>
  <td><input type="number" step="0.5" min="0" max="10" name="{{ prefix }}_weight_{{ loop.index0 }}" value="{{ row.weight }}"></td>
</tr>
{% endfor %}
</tbody>
</table>
</div>
{% endmacro %}
