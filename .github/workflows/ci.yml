name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: meyar-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: ruff + mypy(src) + pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meyar
          POSTGRES_PASSWORD: meyar_dev_password
          POSTGRES_DB: meyar
        ports:
          - 55719:5432
        options: >-
          --health-cmd "pg_isready -U meyar -d meyar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff
        run: uv run ruff check .

      - name: mypy (production source)
        run: uv run mypy src

      - name: pytest
        run: uv run pytest -q
