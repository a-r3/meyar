name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: meyar-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: ruff + mypy(src) + pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector/pgvector:pg16 — official pgvector image on postgres:16,
        # required for `CREATE EXTENSION vector` (Slice 7). Same normal
        # bridge networking as before; D-005 host-network is a local dev
        # workaround, never replicated in CI.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: meyar
          POSTGRES_PASSWORD: meyar_dev_password
          POSTGRES_DB: meyar
        ports:
          - 55719:5432
        options: >-
          --health-cmd "pg_isready -U meyar -d meyar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff
        run: uv run ruff check .

      - name: mypy (production source)
        run: uv run mypy src

      - name: Alembic migration chain (upgrade head, single head)
        env:
          MEYAR_DATABASE_URL: postgresql+asyncpg://meyar:meyar_dev_password@localhost:55719/meyar
        run: |
          uv run alembic upgrade head
          head_count=$(uv run alembic heads | grep -c '(head)')
          if [ "$head_count" -ne 1 ]; then
            echo "Expected exactly one Alembic head, found $head_count" >&2
            exit 1
          fi

      - name: pytest
        run: uv run pytest -q

      - name: local demo wrapper tests
        run: |
          bash -n ../scripts/demo-up.sh
          bash -n ../scripts/demo-down.sh
          python3 ../scripts/tests/test_demo_scripts.py
